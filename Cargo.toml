[package]
name = "daqbuf-streams"
version = "0.0.4"
authors = ["Dominik Werder <dominik.werder@gmail.com>"]
edition = "2021"

[dependencies]
futures-util = "0.3.31"
pin-project = "1.0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11.1"
typetag = "0.2.18"
ciborium = "0.2.2"
bytes = "1.10.1"
arrayref = "0.3.6"
crc32fast = "1.4.2"
byteorder = "1.5.0"
async-channel = "2.3.1"
rand_xoshiro = "0.6.0"
itertools = "0.13.0"
humantime = "2.1.0"
http = "1"
http-body = "1"
http-body-util = "0.1.0"
thiserror = "=0.0.1"
autoerr = "0.0.3"
chrono = { version = "0.4.38", features = ["serde"] }
wasmer = { version = "5.0.1", default-features = false, features = ["sys", "cranelift"], optional = true }
netpod = { path = "../daqbuf-netpod", package = "daqbuf-netpod" }
query = { path = "../daqbuf-query", package = "daqbuf-query" }
items_0 = { path = "../daqbuf-items-0", package = "daqbuf-items-0" }
items_2 = { path = "../daqbuf-items-2", package = "daqbuf-items-2" }
parse = { path = "../daqbuf-parse", package = "daqbuf-parse" }
series = { path = "../daqbuf-series", package = "daqbuf-series" }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

[features]
wasm_transform = ["wasmer"]
indev = []
tests-runtime = []

[patch.crates-io]
thiserror = { git = "https://github.com/dominikwerder/thiserror.git", branch = "cstm" }
