[package]
name = "daqbuf-query"
version = "0.0.3"
authors = ["Dominik Werder <dominik.werder@gmail.com>"]
edition = "2021"

[dependencies]
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
tracing = "0.1.40"
chrono = { version = "0.4.38", features = ["serde"] }
url = "2.5.3"
humantime = "2.1.0"
humantime-serde = "1.1.1"
autoerr = "0.0.3"
netpod = { path = "../daqbuf-netpod", package = "daqbuf-netpod" }
