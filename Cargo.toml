[workspace]
members = ["crates/*"]
resolver = "2"

[profile.release]
opt-level = 1
debug = 0
overflow-checks = false
debug-assertions = false
lto = "thin"
codegen-units = 128
incremental = true

[profile.release2]
inherits = "release"
opt-level = 1
debug = 2
overflow-checks = false
debug-assertions = false
lto = "off"
codegen-units = 32
incremental = true
