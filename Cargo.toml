[package]
name = "mettrics-macros"
version = "0.0.1"
description = "Macros for mettrics crate."
authors = ["Dominik Werder <dominik.werder@gmail.com>"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "parsing"] }
quote = "1"
prettyplease = "0.2"
