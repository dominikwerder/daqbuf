[package]
name = "daqbuf-dbconn"
version = "0.0.2"
authors = ["Dominik Werder <dominik.werder@gmail.com>"]
edition = "2024"

[lib]
path = "src/dbconn.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4", "with-serde_json-1"] }
crc32fast = "1.4.2"
byteorder = "1.5"
futures-util = "0.3.31"
bytes = "1.10.1"
pin-project = "1"
#dashmap = "6.1"
async-channel = "2.5"
chrono = "0.4.39"
regex = "1.11.2"
rand = "0.9.2"
autoerr = "0.0.5"
daqbuf-err = { path = "../daqbuf-err", package = "daqbuf-err" }
netpod = { path = "../daqbuf-netpod", package = "daqbuf-netpod" }
parse = { path = "../daqbuf-parse", package = "daqbuf-parse" }
taskrun = { path = "../daqbuf-taskrun", package = "daqbuf-taskrun" }
