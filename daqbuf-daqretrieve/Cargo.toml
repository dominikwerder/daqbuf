[package]
name = "daqbuf-daqretrieve"
version = "0.6.0"
authors = ["Dominik Werder <dominik.werder@gmail.com>"]
license = "GPL-3.0-only"
edition = "2024"

[dependencies]
futures-util = "0.3.31"
bytes = "1.10.0"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
serde_yaml = "0.9.34"
chrono = "0.4.39"
url = "2.5.4"
autoerr = "0.0.5"
clap = { version = "4.5.28", features = ["derive", "cargo"] }
daqbuf-err = { path = "../daqbuf-err" }
taskrun = { path = "../daqbuf-taskrun", package = "daqbuf-taskrun" }
netpod = { path = "../daqbuf-netpod", package = "daqbuf-netpod" }
disk = { path = "../daqbuf-disk", package = "daqbuf-disk" }
httpclient = { path = "../daqbuf-httpclient", package = "daqbuf-httpclient" }
streams = { path = "../daqbuf-streams", package = "daqbuf-streams" }
# daqbufp2 = { path = "../daqbufp2" }

[features]
DISABLED = []
