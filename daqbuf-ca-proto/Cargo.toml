[package]
name = "daqbuf-ca-proto"
version = "0.0.4"
authors = ["Dominik Werder <dominik.werder@gmail.com>"]
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.37"
async-channel = "2.3.1"
bytes = "1.10"
byteorder = "1.5"
futures-util = { version = "0.3.31", features = ["io"] }
chrono = "0.4"
humantime = "2.1.0"
humantime-serde = "1.1.1"
slidebuf = "0.0.1"
autoerr = "0.0"
series = { path = "../daqbuf-series", package = "daqbuf-series" }
netpod = { path = "../daqbuf-netpod", package = "daqbuf-netpod" }
mettrics = { version = "0.0.7", path = "../mettrics" }
libc = "0.2.175"
clap = { version = "4.5.28", features = ["derive"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "time"] }
ca_proto_tokio = { path = "../daqbuf-ca-proto-tokio", package = "daqbuf-ca-proto-tokio" }

[[bin]]
name = "pva-get"
path = "src/bin/pva_get.rs"
