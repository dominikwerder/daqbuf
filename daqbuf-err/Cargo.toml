[package]
name = "daqbuf-err"
version = "0.0.7"
authors = ["Dominik Werder <dominik.werder@gmail.com>"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
doctest = false

[dependencies]
backtrace = "0.3.68"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11.2"
rmp-serde = "1.1.1"
async-channel = "2.5.0"
chrono = { version = "0.4.26", features = ["serde"] }
url = { version = "2.5.3", default-features = false }
regex = "1.9.1"
http = "1.0.0"
anyhow = "1.0"
autoerr = "0.0"
