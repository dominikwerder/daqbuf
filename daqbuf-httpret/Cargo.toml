[package]
name = "daqbuf-httpret"
version = "0.5.0"
authors = ["Dominik Werder <dominik.werder@gmail.com>"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
path = "src/httpret.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5.4"
http = "1.3.1"
http-body-util = { version = "0.1.2" }
hyper = { version = "1.6.0", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1.10", features = ["http1", "http2", "client", "server"] }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn = { version = "0.11.6", optional = true, default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.22", optional = true, default-features = false, features = ["logging", "std", "ring"] }
rustls-pki-types = { version = "1.11.0", optional = true }
pin-project = "1.1.9"
bytes = "1.10.0"
futures-util = "0.3.31"
tracing = "0.1"
tracing-futures = "0.2"
async-channel = "2.3.1"
itertools = "0.14.0"
time = "0.3.37"
chrono = "0.4.39"
md-5 = "0.10.6"
regex = "1.11.1"
rand = "0.9.0"
ciborium = "0.2.2"
flate2 = "1"
brotli = "8.0.1"
autoerr = "0.0"
daqbuf-err = { path = "../daqbuf-err" }
netpod = { path = "../daqbuf-netpod", package = "daqbuf-netpod" }
query = { path = "../daqbuf-query", package = "daqbuf-query" }
dbconn = { path = "../daqbuf-dbconn", package = "daqbuf-dbconn" }
disk = { path = "../daqbuf-disk", package = "daqbuf-disk" }
items_0 = { path = "../daqbuf-items-0", package = "daqbuf-items-0" }
items_2 = { path = "../daqbuf-items-2", package = "daqbuf-items-2" }
series = { path = "../daqbuf-series", package = "daqbuf-series" }
parse = { path = "../daqbuf-parse", package = "daqbuf-parse" }
streams = { path = "../daqbuf-streams", package = "daqbuf-streams" }
log = { path = "../daqbuf-log", package = "daqbuf-log" }
streamio = { path = "../daqbuf-streamio", package = "daqbuf-streamio" }
nodenet = { path = "../daqbuf-nodenet", package = "daqbuf-nodenet" }
commonio = { path = "../daqbuf-commonio", package = "daqbuf-commonio" }
taskrun = { path = "../daqbuf-taskrun", package = "daqbuf-taskrun" }
scyllaconn = { path = "../daqbuf-scyllaconn", package = "daqbuf-scyllaconn" }
daqbuf-redis = { path = "../daqbuf-redis" }
httpclient = { path = "../daqbuf-httpclient", package = "daqbuf-httpclient" }
daqingest-ui = { path = "../daqbuf-ingest-ui", package = "daqbuf-ingest-ui" }

[features]
default = []
# default = ["http3"]
prometheus_endpoint = []
http3 = ["h3", "h3-quinn", "quinn", "rustls", "rustls-pki-types"]
